<head>

      gtag('config', 'G-YMRH7KF20Q');

    <!-- required meta tags -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reduce costs, optimize routes, and boost efficiency with LogiFlex – the freight analytics platform designed for small and medium logistics operators.">
        <meta name="author" content='"logistics performance analytics platform", "freight cost optimization tool for SMEs", "data-driven decision making in logistics", "logistics analytics SaaS for small freight companies"'>
    <title>AI-Powered Freight Advanced Freight Operations Analysis Report | Logiflex</title>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freight Operations Performance Review</title>
     <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>
 <h1>Executive Summary</h1>
    <p><strong>Total Delay Cost:</strong> {{ report.executive_summary.total_delay_cost }}</p>
    <p><strong>Key Recommendation:</strong> {{ report.executive_summary.top_recommendation }}</p>

    <h2>Delay Trends</h2>
    <canvas id="trendChart" width="600" height="400"></canvas>

    <h2>Carrier Matrix</h2>
    <canvas id="carrierMatrix" width="600" height="400"></canvas>

    <script>
    const trendCtx = document.getElementById('trendChart').getContext('2d');
    const trendChart = new Chart(trendCtx, {
        type: 'line',
        data: {
            labels: {{ report.visuals.delay_trend.labels|safe }},
            datasets: [{
                label: 'Delays',
                data: {{ report.visuals.delay_trend.data|safe }},
                borderColor: 'rgba(255, 99, 132, 1)',
                fill: false,
            }, {
                label: 'On-Time',
                data: {{ report.visuals.ontime_trend.data|safe }},
                borderColor: 'rgba(54, 162, 235, 1)',
                fill: false,
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { position: 'top' } },
            scales: {
                y: { beginAtZero: true },
                x: { display: true }
            }
        }
    });

    const matrixCtx = document.getElementById('carrierMatrix').getContext('2d');
    const carrierMatrix = new Chart(matrixCtx, {
        type: 'scatter',
        data: {
            datasets: {{ report.visuals.carrier_matrix|safe }}
        },
        options: {
            plugins: {
                legend: { display: false }
            },
            scales: {
                x: { title: { display: true, text: 'Cost per Mile' } },
                y: { title: { display: true, text: 'On-Time Delivery %' } }
            }
        }
    });
    </script>

</body>
</html>
